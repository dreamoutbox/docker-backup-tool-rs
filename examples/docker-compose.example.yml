# Example docker-compose for dvb (Docker Volume Backup)
#
# Starting the daemon:
#   docker compose -f docker-compose.example.yml up -d
#
# Running a one-shot backup while the daemon is running:
#   docker exec backup dvb backup db
#
# Listing remote backups:
#   docker exec backup dvb list db
#
# Dry-run retention prune:
#   docker exec backup dvb prune db --dry-run
#
# Checking configuration and connectivity:
#   docker exec backup dvb check

services:
  # Database service to back up
  db:
    image: postgres:18-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql

  # S3-compatible object storage gateway (SeaweedFS)
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: s3
    restart: unless-stopped
    command: [ "server", "-s3", "-s3.port=8333" ]
    environment:
      AWS_ACCESS_KEY_ID: dvbtest
      AWS_SECRET_ACCESS_KEY: dvbtest-secret
      S3_BUCKET: dvb
    ports:
      - "8333:8333"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8333/status" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # dvb backup daemon service
  backup:
    image: dreamoutbox/dvb:latest
    container_name: backup
    restart: unless-stopped
    depends_on:
      s3:
        condition: service_healthy
      db:
        condition: service_started
    volumes:
      # Volumes to back up must be mounted read-only (:ro)
      - pgdata:/backup/pgdata:ro
      # Configuration file
      - ./dvb.example.toml:/etc/dvb/config.toml:ro
      # Docker socket for container control (stop/start/exec).
      # NOTE: The Docker socket gives root-equivalent host access. Mounting it :ro
      # does NOT restrict API actions. In production, we strongly recommend using
      # docker-socket-proxy limited to containers list/stop/start/exec:
      #   CONTAINERS=1
      #   POST=1
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=UTC
      - DVB_LOG=dvb=info

volumes:
  pgdata:
