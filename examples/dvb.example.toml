[docker]
socket = "/var/run/docker.sock"

[[job]]
name = "db"
cron = "0 3 * * *"                         # Every day at 03:00 UTC
run_on_start = true                        # Take an initial backup when the daemon starts
source = ["/backup/pgdata"]
filename = "pgdata-%Y%m%dT%H%M%SZ.tar.zst"
compression = "zstd"
retention_days = 14
min_keep = 3
stop_containers = ["db"]
stop_timeout_secs = 30

[job.storage]
type = "s3"
bucket = "dvb"
region = "us-east-1"
endpoint = "http://s3:8333"
prefix = "db"
access_key_id = "dvbtest"
secret_access_key = "dvbtest-secret"
force_path_style = true
