[docker]
socket = "/var/run/docker.sock"

[job.db]
cron = "0 3 * * *"                         # Every day at 03:00 UTC
run_on_start = true                        # Take an initial backup when the daemon starts
source = ["/backup/pgdump"]
filename = "pgdump-%Y%m%dT%H%M%SZ.tar.zst"
compression = "zstd"
retention_days = 14
min_keep = 3

[job.db.storage]
type = "s3"
bucket = "dvb"
region = "us-east-1"
endpoint = "http://s3:8333"
prefix = "db"
access_key_id = "dvbtest"
secret_access_key = "dvbtest-secret"
force_path_style = true

# Pre-backup hook: dvb runs pg_dump via `docker exec` inside the 'db' container.
# Output goes directly to /backup/pgdump/dump.sql on the shared staging volume.
# No docker CLI or external tools needed in the dvb container itself.
[job.db.pre_backup]
cmd = [
    "pg_dump",
    "-U",
    "postgres",
    "-d",
    "app",
    "--clean",
    "--if-exists",
    "-f",
    "/backup/pgdump/dump.sql",
]
container = "db"
timeout_secs = 3600

[job.db.post_restore]
# Default extraction target directory
dir = "/restore"
cmd = [
    "pg_restore",
    "-U",
    "postgres",
    "-d",
    "app",
    "--clean",
    "--if-exists",
]
container = "db"
timeout_secs = 3600