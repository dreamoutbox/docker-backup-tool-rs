[docker]
socket = "/var/run/docker.sock"

[job.db]
cron = "0 18 * * 5"
timezone = "UTC"
source = ["/backup/pgdata"]
filename = "pgdata-%Y%m%dT%H%M%SZ.tar.zst"
compression = "zstd"
retention_days = 14
min_keep = 3
stop_containers = ["postgres"]
  [job.db.storage]
  type = "s3"
  bucket = "bk"
  region = "eu-west-1"
  prefix = "db/"

  [job.db.pre_backup]
  cmd = ["pg_dump", "-U", "postgres"]
  container = "postgres"
  timeout_secs = 300

  [job.db.post_backup]
  cmd = ["/bin/notify.sh", "ok"]
  run_on = "always"
  timeout_secs = 60

  [job.db.post_restore]
  dir = "/restore"
  cmd = ["pg_restore", "-U", "postgres"]
  container = "postgres"
  timeout_secs = 1800

[job.web]
crontext = "every friday at 18:00"
timezone = "Europe/Berlin"
source = ["/var/www/html", "/var/www/uploads"]
filename = "web-%Y%m%dT%H%M%SZ.tar.zst"
compression = "zstd"
retention_days = 7
min_keep = 2
  [job.web.storage]
  type = "fs"
  root = "/backup/storage"
  prefix = "web"

[job.logs]
cron = "0 0 * * *"
timezone = "UTC"
source = ["/var/log"]
filename = "logs-%Y%m%dT%H%M%SZ.tar.zst"
compression = "gzip"
retention_days = 30
min_keep = 5
  [job.logs.storage]
  type = "sftp"
  endpoint = "sftp.example.com:22"
  user = "backupuser"
  root = "/remote/logs"
  known_hosts_strategy = "strict"