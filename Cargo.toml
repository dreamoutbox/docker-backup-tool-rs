[package]
name = "dvb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Docker volume backup tool: tar+compress mounted paths and stream them to object storage"
license = "MIT"
readme = "README.md"

[dependencies]
# Every direct dependency is pinned with `=` so a rebuild cannot silently pick
# up a new minor version. `cargo update -p <crate> --precise <version>` is how
# bumps happen.

# CLI and process plumbing
clap = { version = "=4.6.7", features = ["derive", "env"] }
anyhow = "=1.0.104"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["io", "io-util"] }

# Configuration
serde = { version = "=1.0.229", features = ["derive"] }
figment = { version = "=0.10.19", features = ["toml", "env"] }
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
chrono-tz = "=0.10.4"
croner = "=4.0.0"

# Storage. `default-features = false` plus explicit features keeps the TLS
# stack on rustls; native-tls/openssl must never appear in `cargo tree`.
opendal = { version = "=0.59.3", default-features = false, features = [
  "executors-tokio",
  # `http-transport-reqwest` (not just its `-rustls` leaf) because the facade's
  # `install_default()` is gated on the former; the leaf alone builds the
  # transport but never installs it.
  "http-transport-reqwest",
  "layers-logging",
  "layers-retry",
  "layers-timeout",
  "services-dropbox",
  "services-fs",
  "services-memory",
  "services-s3",
  "services-sftp",
] }

# Archiving
tar = "=0.4.46"
zstd = "=0.14.0"
flate2 = "=1.1.10"

# Cross-process job locking
fd-lock = "=4.0.4"

# Docker control (phase 3): stop/start containers for consistency and run
# container hooks. Default features are `http` + `pipe` - the unix socket and
# plain HTTP transports - so no TLS stack is pulled in here.
bollard = "=0.21.1"
# Draining the attach stream from a container exec; already in the tree via
# bollard, listed here because we name it directly.
futures-util = "=0.3.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# NOTE: `panic = "abort"` is intentionally NOT set. Cleanup guards (stop guards,
# temp file removal) rely on unwinding.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `Error` carries sources and paths for diagnostics; boxing every variant would
# cost an allocation per error for no benefit, since errors are rare.
result_large_err = "allow"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
serde_json = "=1.0.149"
tempfile = "=3.27.0"
# Container-backed integration tests (tests/s3_minio.rs, tests/sftp.rs). These
# are `#[ignore]`d by default: run them with `cargo test -- --ignored`.
testcontainers = { version = "=0.28.0", default-features = false, features = ["ring", "http_wait"] }
# Readiness polling for the SeaweedFS gateway in tests/s3_minio.rs.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }

# Reused by tests/e2e_fs.rs, which reads real archives and holds a job lock the
# way a second process would.
fd-lock = "=4.0.4"
tar = "=0.4.46"
zstd = "=0.14.0"
flate2 = "=1.1.10"
